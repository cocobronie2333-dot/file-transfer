name: Deploy upload page to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['static/**', 'tests/*.cjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend
        run: |
          node --check static/app.js
          node tests/test_sha256.cjs
          node tests/test_frontend.cjs
          node tests/test_login.cjs
      - uses: actions/configure-pages@v5
      - name: Upload only the public frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
